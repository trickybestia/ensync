name: Rust

on:
  push:
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        features: ["--all-features", "--no-default-features"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up the MSVC toolchain
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Build release
        run: cargo build --release --locked ${{ matrix.features }}
      - name: Test release
        run: cargo test --release --locked ${{ matrix.features }}
      - name: Sync smoke test (Linux)
        if: runner.os == 'Linux'
        run: python3 tests/sync_smoke.py target/release/ensync
      - name: Signal smoke test
        if: runner.os == 'Linux'
        run: python3 tests/signal_smoke.py target/release/ensync
      - name: Sync smoke test (Windows)
        if: runner.os == 'Windows'
        run: python tests/sync_smoke.py target/release/ensync.exe
