name: Rust

on:
  push:
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        features: ["--all-features", "--no-default-features"]
    steps:
      - uses: actions/checkout@v4
      - name: Build release
        run: cargo build --release --locked ${{ matrix.features }}
      - name: Test release
        run: cargo test --release --locked ${{ matrix.features }}
      - name: Signal smoke test
        run: python3 tests/signal_smoke.py target/release/ensync
